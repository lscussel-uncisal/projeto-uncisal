name: Security scan

# Roda em todo push/PR, independente do pre-commit local (defesa em profundidade:
# cobre o caso de alguem commitar com --no-verify ou sem os hooks instalados).
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (busca por segredos no historico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (dependencias com vulnerabilidade conhecida)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
