services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: helpdesk:latest
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # IMPORTANTE: DATABASE_PATH no .env precisa apontar para dentro deste volume
      # (ex.: /app/db/db.sqlite3) — senao o SQLite e escrito fora dele e some a cada rebuild.
      - db_data:/app/db
      # media/ persiste (conteudo enviado por usuarios, se essa feature existir no futuro).
      # staticfiles/ NAO precisa de volume: o Whitenoise le do proprio disco do container e
      # o entrypoint roda "collectstatic" a cada start — regenerado sempre, nunca externo
      # (o Nginx do host tambem nao le esse caminho — ver docker/nginx/helpdesk.conf).
      - media_data:/app/media
    # Publicado apenas em loopback: quem recebe trafego externo e o Nginx do host,
    # que faz proxy_pass para 127.0.0.1:8000 (menor privilegio).
    ports:
      - "127.0.0.1:8000:8000"

  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: helpdesk:latest
    restart: unless-stopped
    env_file:
      - ../.env
    # So le o banco pra tirar o snapshot (sqlite3 .backup) — nunca precisa escrever nele,
    # entao o volume fica montado read-only aqui (defesa em profundidade: um bug neste
    # processo nao consegue corromper o banco de producao).
    volumes:
      - db_data:/app/db:ro
      - media_data:/app/media:ro
    entrypoint: ["/app/backup-scheduler.sh"]
    # BACKUP_ENABLED=False (sem as variaveis do R2 no .env) faz o job agendado falhar e
    # logar, sem quebrar o resto da aplicacao — mesmo comportamento do botao "Backup agora".

volumes:
  db_data:
  media_data:
