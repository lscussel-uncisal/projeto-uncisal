# Configuracao de referencia para o Nginx DO HOST (nao roda dentro do Docker).
# Copiar para /etc/nginx/sites-available/helpdesk e criar symlink em sites-enabled.
# Certbot injeta os blocos de "listen 443 ssl" e o redirect automatico ao ser executado
# com "certbot --nginx". Os trechos de Cloudflare abaixo devem ser adicionados manualmente.
#
# A aplicacao roda no subdominio uncisal.lserpsistemas.com.br — o dominio raiz
# (lserpsistemas.com.br) fica reservado para uma futura pagina institucional, fora
# deste projeto (ver docs/architecture/decisions.md, ADR-012).

# Restaura o IP real do visitante a partir do header enviado pela Cloudflare.
# Lista completa e atualizada de ranges em: https://www.cloudflare.com/ips/
# (gerar via `curl -s https://www.cloudflare.com/ips-v4` / `ips-v6` e colar aqui)
# set_real_ip_from 173.245.48.0/20;
# ... (demais ranges IPv4 e IPv6 da Cloudflare)
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name uncisal.lserpsistemas.com.br;

    # Certbot substitui este bloco por um redirect 301 para HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name uncisal.lserpsistemas.com.br;

    # ssl_certificate / ssl_certificate_key preenchidos pelo Certbot.

    # Autenticacao de origem: so aceita trafego que a Cloudflare assinou.
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # challenges.cloudflare.com: necessario para o widget do Turnstile carregar e postar o token.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 5M;

    # Sem "location /static/" com "alias": o volume Docker do staticfiles nao e um
    # caminho de disco acessivel diretamente pelo Nginx do host (e um volume nomeado,
    # gerenciado pelo Docker). O Whitenoise ja serve os estaticos com compressao e cache
    # de longa duracao (ver config/settings/base.py, STORAGES) — tudo passa pelo proxy.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
