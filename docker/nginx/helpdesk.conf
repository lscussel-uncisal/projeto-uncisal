# Configuracao de referencia para o Nginx DO HOST (nao roda dentro do Docker).
# Copiar para /etc/nginx/sites-available/helpdesk e criar symlink em sites-enabled.
#
# A aplicacao roda no subdominio uncisal.lserpsistemas.com.br — o dominio raiz
# (lserpsistemas.com.br) fica reservado para uma futura pagina institucional, fora
# deste projeto (ver docs/architecture/decisions.md, ADR-012).
#
# Certificado emitido via: sudo certbot --nginx -d uncisal.lserpsistemas.com.br
# Renovacao automatica: timer do snap (`systemctl list-timers | grep certbot`), sem
# necessidade de cron manual — ver ADR-027.

# Restaura o IP real do visitante a partir do header enviado pela Cloudflare. Sem isto,
# TODO visitante aparece nos logs com o IP da borda da Cloudflare, e pior: o app confia no
# header CF-Connecting-IP (apps/accounts/services.py::client_ip) para o throttle de login —
# sem restringir quem pode falar com a origem (ver UFW abaixo), esse header seria forjavel.
# Lista oficial: https://www.cloudflare.com/ips/ (atualizar se a Cloudflare publicar ranges novos)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    # "http2 on;" (sintaxe nova) exige Nginx >=1.25.1 — o pacote do Ubuntu 24.04 ainda
    # empacota 1.24.0, entao usamos a sintaxe antiga aqui.
    listen 443 ssl http2;
    server_name uncisal.lserpsistemas.com.br;

    ssl_certificate /etc/letsencrypt/live/uncisal.lserpsistemas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uncisal.lserpsistemas.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Authenticated Origin Pulls: so aceita conexao HTTPS assinada pela propria Cloudflare —
    # fecha o desvio de "bater direto no IP do servidor" mesmo que alguem descubra o IP,
    # complementando (nao substituindo) a restricao de IP no UFW.
    # Certificado publico, fixo, da Cloudflare (nao e segredo):
    # https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    # Ja ligado no painel Cloudflare (SSL/TLS > Origin Server > Global) — nessa ordem, primeiro
    # o lado Cloudflare, so depois "ssl_verify_client on" aqui; na ordem errada, a Cloudflare
    # ainda nao manda certificado nenhum e o Nginx passa a rejeitar TODO o trafego dela.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # So os headers que o Django NAO manda (SecurityMiddleware ja cobre HSTS, X-Frame-Options,
    # X-Content-Type-Options e Referrer-Policy via config/settings/prod.py — duplicar aqui fazia
    # o Qualys SSL Labs invalidar o HSTS por completo: "Server provided more than one HSTS
    # header", derrubando a nota de A para A-. Ver ADR-027).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # challenges.cloudflare.com: necessario para o widget do Turnstile carregar e postar o token.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 5M;

    # Sem "location /static/" com "alias": o volume Docker do staticfiles nao e um
    # caminho de disco acessivel diretamente pelo Nginx do host (e um volume nomeado,
    # gerenciado pelo Docker). O Whitenoise ja serve os estaticos com compressao e cache
    # de longa duracao (ver config/settings/base.py, STORAGES) — tudo passa pelo proxy.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name uncisal.lserpsistemas.com.br;

    if ($host = uncisal.lserpsistemas.com.br) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
