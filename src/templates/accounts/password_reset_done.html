{% extends "base.html" %}
{% block title %}Recuperar senha · Central de Chamados{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <div class="rounded-xl border border-slate-200 bg-white p-6 text-center shadow-sm">
        <div class="mx-auto mb-4 flex h-11 w-11 items-center justify-center rounded-full bg-green-50 text-green-600">
            <svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/></svg>
        </div>
        <h1 class="mb-2 text-lg font-semibold text-slate-900">Pedido enviado</h1>
        <p class="text-sm text-slate-600">
            Se esse e-mail estiver cadastrado, uma senha temporária foi enviada. Confira sua
            caixa de entrada (e o spam).
        </p>
        <a href="{% url 'accounts:login' %}" class="mt-4 inline-block text-sm text-slate-700 hover:underline">
            Voltar para o login
        </a>
    </div>
</div>
{% endblock %}
