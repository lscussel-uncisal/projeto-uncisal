{% extends "base.html" %}
{% block title %}Login · Central de Chamados{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white shadow rounded-lg p-6">
    <h1 class="text-xl font-semibold mb-4">Entrar</h1>

    {# TODO(proxima etapa): Cloudflare Turnstile + tela de segundo fator (TOTP/e-mail). #}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-4 rounded-md bg-slate-900 text-white py-2">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
